<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Cacanisette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>La Cacanisette</h1>
  </header>

  <main>
    <!-- Section Ajouter un film -->
    <section class="add-section">
      <h2>Ajouter un film</h2>
      <div class="search-container">
        <input type="text" id="movie-input" placeholder="Titre du film..." autocomplete="off" />
        <div id="suggestions-box" class="suggestions-box"></div>
      </div>

      <div class="scan-container">
        <label for="folder-input" class="scan-btn">Scan Caca</label>
        <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none;" />
      </div>
    </section>

    <!-- Section Tri, Filtres & Aléatoire -->
    <section class="controls-section">
      <div class="controls-header">
        <h2>Trier les Caca</h2>
        <button id="random-btn" class="random-btn">La Roullette de la Cacanisette</button>
      </div>

      <div class="filters">
        <label for="sort-select">Trier par :</label>
        <select id="sort-select">
          <option value="added-desc">Ajout Récent</option>
          <option value="added-asc">Ajout Pas Récent</option>
          <option value="year-desc">Date de sortie (plus récent)</option>
          <option value="year-asc">Date de sortie (pas récent)</option>
          <option value="director">Réal</option>
          <option value="duration-asc">Durée (plus courts)</option>
          <option value="duration-desc">Durée (pas courts)</option>
          <option value="title">Titre</option>
        </select>

        <label for="filter-genre">Genre :</label>
        <select id="filter-genre">
          <option value="all">Tous les genres</option>
        </select>
      </div>
    </section>

    <!-- Grille des films avec le Compteur -->
    <section class="collection-section">
      <div class="collection-header">
        <h2>Ma Collection <span id="movie-count" class="movie-count">(0 film)</span></h2>
      </div>
      <div id="movies-grid" class="movies-grid">
        <!-- Les films apparaîtront ici dynamiquement -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
